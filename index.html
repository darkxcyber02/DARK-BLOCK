<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>DARK_BLOCK</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    touch-action:none;
    font-family:Arial,sans-serif;
}

#loading{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
    radial-gradient(circle at center,#18354d,#05090d 65%,#000);
    color:white;
}

.title{
    font-size:clamp(42px,12vw,85px);
    font-weight:900;
    letter-spacing:6px;
    text-shadow:0 0 12px #00aaff,0 0 30px #0066ff;
}

.subtitle{
    margin-top:10px;
    color:#b9eaff;
    letter-spacing:4px;
    font-size:12px;
}

.bar{
    width:min(75vw,420px);
    height:14px;
    margin-top:35px;
    border:2px solid #ffffff88;
    border-radius:20px;
    overflow:hidden;
    background:#0008;
}

#progress{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#0099ff,#8beaff);
    box-shadow:0 0 15px #00aaff;
}

#loadText{
    margin-top:12px;
    font-size:12px;
    letter-spacing:2px;
    color:#d8f5ff;
}

#game{
    position:fixed;
    inset:0;
    display:none;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#crosshair{
    position:absolute;
    z-index:20;
    left:50%;
    top:50%;
    width:18px;
    height:18px;
    transform:translate(-50%,-50%);
    pointer-events:none;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 3px #000;
}

#crosshair:before{
    width:18px;
    height:2px;
    top:8px;
}

#crosshair:after{
    width:2px;
    height:18px;
    left:8px;
}

#logo{
    position:absolute;
    z-index:30;
    top:14px;
    left:15px;
    color:white;
    font-weight:900;
    font-size:20px;
    letter-spacing:2px;
    text-shadow:0 2px 5px #000;
}

#info{
    position:absolute;
    z-index:30;
    top:40px;
    left:16px;
    color:#d9edff;
    font-size:10px;
}

#joystick{
    position:absolute;
    z-index:50;
    left:24px;
    bottom:25px;
    width:125px;
    height:125px;
    border-radius:50%;
    border:2px solid #ffffff44;
    background:#ffffff12;
}

#stick{
    position:absolute;
    width:56px;
    height:56px;
    left:33px;
    top:33px;
    border-radius:50%;
    border:2px solid #ffffff99;
    background:#ffffff40;
}

.button{
    position:absolute;
    z-index:50;
    width:62px;
    height:62px;
    border-radius:50%;
    border:2px solid #ffffff55;
    background:#0007;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
    user-select:none;
}

.button:active{
    transform:scale(.9);
    background:#ffffff33;
}

#jump{
    right:28px;
    bottom:42px;
}

#shift{
    right:103px;
    bottom:27px;
}

#break{
    right:103px;
    bottom:112px;
}

#place{
    right:28px;
    bottom:120px;
}

#hotbar{
    position:absolute;
    z-index:40;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    display:flex;
    gap:4px;
}

.slot{
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid #ffffff44;
    background:#0009;
    color:white;
    font-size:20px;
}

.slot.selected{
    border:3px solid white;
    box-shadow:0 0 10px #fff8;
}

#health{
    position:absolute;
    z-index:30;
    left:50%;
    bottom:78px;
    transform:translateX(-50%);
    width:min(230px,50vw);
    height:12px;
    border:2px solid #fff9;
    background:#0009;
    border-radius:10px;
    overflow:hidden;
}

#healthBar{
    width:100%;
    height:100%;
    background:#35d46b;
}

@media(min-width:900px){
    #joystick,.button{
        opacity:.55;
    }
}
</style>
</head>

<body>

<div id="loading">
    <div class="title">DARK_BLOCK</div>
    <div class="subtitle">BUILD • EXPLORE • SURVIVE</div>

    <div class="bar">
        <div id="progress"></div>
    </div>

    <div id="loadText">Loading World...</div>
</div>

<div id="game">

    <div id="logo">DARK_BLOCK</div>
    <div id="info">WORLD 01 • SURVIVAL</div>

    <div id="crosshair"></div>

    <div id="health">
        <div id="healthBar"></div>
    </div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="break" class="button">BREAK</div>
    <div id="place" class="button">PLACE</div>
    <div id="jump" class="button">JUMP</div>
    <div id="shift" class="button">SHIFT</div>

    <div id="hotbar">
        <div class="slot selected">🟩</div>
        <div class="slot">🟫</div>
        <div class="slot">⬜</div>
        <div class="slot">🪨</div>
        <div class="slot">🪵</div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* ==============================
   LOADING
============================== */

const loading=document.getElementById("loading");
const progress=document.getElementById("progress");
const loadText=document.getElementById("loadText");

let load=0;

const messages=[
    "Loading World...",
    "Generating Blocks...",
    "Preparing Player...",
    "Preparing Controls...",
    "Starting DARK_BLOCK..."
];

const timer=setInterval(()=>{

    load+=Math.floor(Math.random()*9)+5;

    if(load>100) load=100;

    progress.style.width=load+"%";

    const i=Math.min(
        Math.floor(load/21),
        messages.length-1
    );

    loadText.textContent=messages[i];

    if(load>=100){

        clearInterval(timer);

        setTimeout(()=>{
            loading.style.display="none";
            document.getElementById("game").style.display="block";
            startGame();
        },500);
    }

},160);


/* ==============================
   GAME VARIABLES
============================== */

let scene;
let camera;
let renderer;
let player;

let velocityY=0;
let grounded=true;

let moveX=0;
let moveZ=0;
let running=false;

let yaw=0;
let pitch=0;

const keys={};

const blocks=[];


/* ==============================
   MATERIALS
============================== */

const grass=new THREE.MeshLambertMaterial({
    color:0x55a83f
});

const dirt=new THREE.MeshLambertMaterial({
    color:0x79512d
});

const stone=new THREE.MeshLambertMaterial({
    color:0x777777
});


/* ==============================
   BLOCK
============================== */

function addBlock(x,y,z,material){

    const geometry=
        new THREE.BoxGeometry(1,1,1);

    const block=
        new THREE.Mesh(
            geometry,
            material
        );

    block.position.set(x,y,z);

    block.receiveShadow=true;
    block.castShadow=true;

    scene.add(block);

    blocks.push(block);
}


/* ==============================
   WORLD
============================== */

function createWorld(){

    const size=18;

    for(let x=-size;x<=size;x++){

        for(let z=-size;z<=size;z++){

            addBlock(
                x,
                0,
                z,
                grass
            );

            addBlock(
                x,
                -1,
                z,
                dirt
            );

            addBlock(
                x,
                -2,
                z,
                stone
            );
        }
    }
}


/* ==============================
   SKY
============================== */

function createSky(){

    scene.background=
        new THREE.Color(0x79c4f2);

    scene.fog=
        new THREE.Fog(
            0x79c4f2,
            25,
            75
        );
}


/* ==============================
   LIGHT
============================== */

function createLights(){

    const ambient=
        new THREE.AmbientLight(
            0xffffff,
            1.15
        );

    scene.add(ambient);

    const sun=
        new THREE.DirectionalLight(
            0xffffff,
            1.8
        );

    sun.position.set(
        25,
        35,
        15
    );

    sun.castShadow=true;

    scene.add(sun);
}


/* ==============================
   PLAYER
============================== */

function createPlayer(){

    player=
        new THREE.Object3D();

    player.position.set(
        0,
        1.7,
        6
    );

    scene.add(player);

    camera=
        new THREE.PerspectiveCamera(
            75,
            window.innerWidth/
            window.innerHeight,
            0.05,
            200
        );

    camera.position.set(
        0,
        0,
        0
    );

    player.add(camera);
}


/* ==============================
   START
============================== */

function startGame(){

    scene=
        new THREE.Scene();

    createSky();
    createLights();
    createWorld();
    createPlayer();

    renderer=
        new THREE.WebGLRenderer({
            antialias:true,
            powerPreference:
                "high-performance"
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            1.5
        )
    );

    renderer.shadowMap.enabled=true;

    document
        .getElementById("game")
        .prepend(renderer.domElement);

    setupKeyboard();
    setupJoystick();
    setupButtons();
    setupCamera();

    window.addEventListener(
        "resize",
        resize
    );

    animate();
}


/* ==============================
   KEYBOARD
============================== */

function setupKeyboard(){

    window.addEventListener(
        "keydown",
        e=>{

            keys[e.code]=true;

            if(
                e.code==="ShiftLeft" ||
                e.code==="ShiftRight"
            ){
                running=true;
            }

            if(
                e.code==="Space" &&
                grounded
            ){

                velocityY=.19;
                grounded=false;
            }
        }
    );

    window.addEventListener(
        "keyup",
        e=>{

            keys[e.code]=false;

            if(
                e.code==="ShiftLeft" ||
                e.code==="ShiftRight"
            ){
                running=false;
            }
        }
    );
}


/* ==============================
   JOYSTICK
============================== */

function setupJoystick(){

    const joystick=
        document.getElementById(
            "joystick"
        );

    const stick=
        document.getElementById(
            "stick"
        );

    let active=false;

    let centerX=0;
    let centerY=0;

    function start(e){

        e.preventDefault();

        active=true;

        const rect=
            joystick.getBoundingClientRect();

        centerX=
            rect.left+
            rect.width/2;

        centerY=
            rect.top+
            rect.height/2;

        move(e);
    }

    function move(e){

        if(!active)return;

        const t=e.touches[0];

        let dx=
            t.clientX-centerX;

        let dy=
            t.clientY-centerY;

        const max=35;

        const distance=
            Math.sqrt(dx*dx+dy*dy);

        if(distance>max){

            dx=
                dx/distance*max;

            dy=
                dy/distance*max;
        }

        stick.style.transform=
            `translate(${dx}px,${dy}px)`;

        moveX=dx/max;
        moveZ=dy/max;
    }

    function end(){

        active=false;

        moveX=0;
        moveZ=0;

        stick.style.transform=
            "translate(0,0)";
    }

    joystick.addEventListener(
        "touchstart",
        start,
        {passive:false}
    );

    joystick.addEventListener(
        "touchmove",
        move,
        {passive:false}
    );

    joystick.addEventListener(
        "touchend",
        end
    );
}


/* ==============================
   BUTTONS
============================== */

function setupButtons(){

    const jump=
        document.getElementById("jump");

    const shift=
        document.getElementById("shift");

    jump.addEventListener(
        "touchstart",
        e=>{

            e.preventDefault();

            if(grounded){

                velocityY=.19;
                grounded=false;
            }
        },
        {passive:false}
    );

    shift.addEventListener(
        "touchstart",
        e=>{

            e.preventDefault();

            running=true;
        },
        {passive:false}
    );

    shift.addEventListener(
        "touchend",
        ()=>{
            running=false;
        }
    );
}


/* ==============================
   CAMERA TOUCH
============================== */

function setupCamera(){

    let touching=false;
    let lastX=0;
    let lastY=0;

    document
    .getElementById("game")
    .addEventListener(
        "touchstart",
        e=>{

            if(
                e.target.closest(
                    "#joystick,.button"
                )
            ){
                return;
            }

            touching=true;

            const t=e.touches[0];

            lastX=t.clientX;
            lastY=t.clientY;
        },
        {passive:false}
    );

    document
    .getElementById("game")
    .addEventListener(
        "touchmove",
        e=>{

            if(!touching)return;

            const t=e.touches[0];

            const dx=
                t.clientX-lastX;

            const dy=
                t.clientY-lastY;

            lastX=t.clientX;
            lastY=t.clientY;

            yaw-=dx*.004;
            pitch-=dy*.004;

            const limit=1.45;

            pitch=
                Math.max(
                    -limit,
                    Math.min(
                        limit,
                        pitch
                    )
                );
        },
        {passive:false}
    );

    document
    .getElementById("game")
    .addEventListener(
        "touchend",
        ()=>{
            touching=false;
        }
    );
}


/* ==============================
   MOVEMENT
============================== */

function updatePlayer(){

    let forward=0;
    let side=0;

    if(keys["KeyW"])
        forward=1;

    if(keys["KeyS"])
        forward=-1;

    if(keys["KeyA"])
        side=-1;

    if(keys["KeyD"])
        side=1;

    forward+=-moveZ;
    side+=moveX;

    const length=
        Math.sqrt(
            forward*forward+
            side*side
        );

    if(length>1){

        forward/=length;
        side/=length;
    }

    const speed=
        running?.14:.075;

    const direction=
        new THREE.Vector3(
            0,
            0,
            1
        );

    direction.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        yaw
    );

    const right=
        new THREE.Vector3(
            1,
            0,
            0
        );

    right.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        yaw
    );

    player.position.addScaledVector(
        direction,
        forward*speed
    );

    player.position.addScaledVector(
        right,
        side*speed
    );


    /* gravity */

    velocityY-=.009;

    player.position.y+=velocityY;

    if(player.position.y<=1.7){

        player.position.y=1.7;

        velocityY=0;

        grounded=true;
    }


    /* limits */

    const limit=17;

    player.position.x=
        Math.max(
            -limit,
            Math.min(
                limit,
                player.position.x
            )
        );

    player.position.z=
        Math.max(
            -limit,
            Math.min(
                limit,
                player.position.z
            )
        );
}


/* ==============================
   CAMERA ROTATION
============================== */

function updateCamera(){

    camera.rotation.order="YXZ";

    camera.rotation.y=yaw;

    camera.rotation.x=pitch;
}


/* ==============================
   RESIZE
============================== */

function resize(){

    camera.aspect=
        window.innerWidth/
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


/* ==============================
   GAME LOOP
============================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    updatePlayer();
    updateCamera();

    renderer.render(
        scene,
        camera
    );
}

</script>

</body>
</html>
